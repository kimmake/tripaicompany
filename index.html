<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anywhere — Official Website</title>
    <meta name="description" content="Anywhere 공식 홈페이지. Anywhere가 개발하고 있는 첫 번째 서비스, AI 기반 맞춤형 여행 추천 서비스 TripAI를 소개합니다." />
    <meta name="theme-color" content="#14283F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph / Twitter: 이미지는 public/og-image.jpg 를 교체하면 됩니다 (1200×630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anywhere" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Anywhere presents TripAI" />
    <meta property="og:description" content="Anywhere의 첫 번째 여정, TripAI — AI 기반 맞춤형 여행 추천 서비스." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="구름 위를 나는 비행기 날개" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anywhere presents TripAI" />
    <meta name="twitter:description" content="Anywhere의 첫 번째 여정, TripAI — AI 기반 맞춤형 여행 추천 서비스." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <!-- 히어로 레이어 이미지 우선 로드 (하늘 · 날개) -->
    <link rel="preload" as="image" type="image/webp" imagesrcset="/images/hero/sky-1280.webp 1280w, /images/hero/sky-2400.webp 2400w" imagesizes="(orientation: portrait) 160vh, 100vw" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" imagesrcset="/images/hero/wing-1280.webp 1280w, /images/hero/wing-2400.webp 2400w" imagesizes="(orientation: portrait) 160vh, 100vw" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">Anywhere — 이 웹사이트는 JavaScript를 사용합니다.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
